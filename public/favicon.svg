<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Circular container with dark slate background -->
  <circle cx="32" cy="32" r="30" fill="#0d1b2a" stroke="#4ecdc4" stroke-width="2.5"/>
  
  <!-- Sunrise Gold Sun over the mountain -->
  <circle cx="42" cy="22" r="7" fill="#f4a94e"/>
  <circle cx="42" cy="22" r="10" stroke="#f4a94e" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Back Mountain Peak -->
  <polygon points="18,44 38,18 52,44" fill="#1a3a4a"/>
  <!-- Back Mountain Snowcap -->
  <polygon points="38,18 32,26 38,24 44,26" fill="#f8f9fa"/>

  <!-- Front Mountain Peak -->
  <polygon points="8,46 26,14 46,46" fill="#142c3d"/>
  <!-- Left shaded side of front mountain -->
  <polygon points="8,46 26,14 26,46" fill="#4ecdc4" opacity="0.35"/>
  <!-- Front Mountain Snowcap -->
  <polygon points="26,14 19,25 24,23 26,25 30,22 34,25" fill="#f8f9fa"/>

  <!-- Kareri Lake Water & Glacial Reflection -->
  <path d="M12 46 Q26 43 52 46 Q32 50 12 46 Z" fill="#4ecdc4" opacity="0.85"/>
  <ellipse cx="32" cy="48" rx="16" ry="3" fill="#4ecdc4" opacity="0.5"/>
  <ellipse cx="32" cy="52" rx="10" ry="1.5" fill="#f4a94e" opacity="0.6"/>
</svg>
